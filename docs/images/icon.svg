<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- SC-CargoPlan app icon, variant A: flat (isometric SCU grid, 2x2x2). Source of src/CargoPlan.App/cargoplan.ico (K5.4). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15213A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Large cube: three faces -->
  <!-- left face -->
  <polygon points="128,226 50,181 50,91 128,136" fill="#0F766E"/>
  <!-- right face -->
  <polygon points="128,226 206,181 206,91 128,136" fill="#14B8A6"/>
  <!-- top face -->
  <polygon points="128,136 50,91 128,46 206,91" fill="#5EEAD4"/>

  <!-- Front upper sub-cube in orange (= a planned slot) -->
  <polygon points="128,136 89,113.5 128,91 167,113.5" fill="#FFC14D"/>
  <polygon points="128,136 89,113.5 89,158.5 128,181" fill="#C27A00"/>
  <polygon points="128,136 167,113.5 167,158.5 128,181" fill="#E69F00"/>

  <!-- Grid lines (joints) -->
  <g fill="none" stroke="#0B1220" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- top face -->
    <line x1="89" y1="68.5" x2="167" y2="113.5"/>
    <line x1="167" y1="68.5" x2="89" y2="113.5"/>
    <!-- left face -->
    <line x1="89" y1="113.5" x2="89" y2="203.5"/>
    <line x1="50" y1="136" x2="128" y2="181"/>
    <!-- right face -->
    <line x1="167" y1="113.5" x2="167" y2="203.5"/>
    <line x1="206" y1="136" x2="128" y2="181"/>
    <!-- outline and main edges -->
    <polygon points="128,226 50,181 50,91 128,46 206,91 206,181"/>
    <line x1="128" y1="136" x2="50" y2="91"/>
    <line x1="128" y1="136" x2="206" y2="91"/>
    <line x1="128" y1="136" x2="128" y2="226"/>
  </g>
</svg>
