# Source: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
name: Ship correction
description: A ship SC-CargoPlan knows, but its racks don't match the game.
labels: [bug, ship]
body:
  - type: markdown
    attributes:
      value: |
        The ship data live in their own repository, [sc-cargoplan-shipdata](https://github.com/MRiediger/sc-cargoplan-shipdata), and come to the overlay as a monthly data release. The racks of all but two ships come from the game files, by way of cryon.rocks (Motherlode); the 135c and the 600i Executive Edition still use Fleetyards data. A rack in the wrong place or with the wrong size is usually in the game data itself: we report it to Motherlode (cryon.rocks), and the next data release fixes it for everyone. Report a door limit here too. The ship files are rebuilt each month from the game files, so a hand-edited file would be overwritten: this form is the way, not a pull request.

  - type: input
    id: ship
    attributes:
      label: Ship
      description: As the ship list in the overlay names it. If you looked into the ship file, its file name in the ship data (`ship-data\ships\` next to the app) or its `modelKey` helps too.
      placeholder: DRAK Cutlass Black
    validations:
      required: true

  - type: input
    id: racks
    attributes:
      label: Rack number
      description: The rack number the overlay shows, or "missing" for a rack the overlay doesn't have.
      placeholder: Rack 2
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      description: Pick all that apply.
      multiple: true
      options:
        - Position (the rack lies elsewhere in the ship)
        - Size (more or fewer cells than in the game)
        - Stack direction (crates stack the other way)
        - Door limit (the game takes smaller or larger crates)
    validations:
      required: true

  - type: textarea
    id: difference
    attributes:
      label: What differs
      description: |
        What the overlay shows and what the game does, e.g. the size in SCU cells (along the plate × across it × how many
        crates stack), a door that takes smaller crates, or a crate that fits in the game but not in the plan.
      placeholder: |
        Overlay: Rack 2 is 4 × 2 × 2 = 16 SCU.
        Game: the plate takes 3 × 2 × 2 = 12 SCU; the fourth row is blocked by the ramp.
    validations:
      required: true

  - type: upload
    id: screenshot-game
    attributes:
      label: Screenshot in the game
      description: The hold in the hangar, ideally with crates on it. Optional, but it helps a lot.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.webm"

  - type: upload
    id: screenshot-overlay
    attributes:
      label: Screenshot of the overlay
      description: The same ship in the overlay, turned so the rack shows. Optional.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.webm"

  - type: input
    id: game-version
    attributes:
      label: Star Citizen version
      description: The patch you checked it in.
      placeholder: 4.10.2-LIVE
    validations:
      required: true
