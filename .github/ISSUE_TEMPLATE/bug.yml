# Source: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
name: Bug report
description: Something in SC-CargoPlan doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SC-CargoPlan version
      description: Copy it from the footer of the settings window (the gear in the overlay's header).
      placeholder: 0.1.0+6bbc115…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enter two missions for Riker and Shubin in the editor
        2. Press Plan
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: |
        What happened instead? Copy any amber line from the overlay word for word.
        If the overlay closed with an error or says "sync failed", attach `%LocalAppData%\SC-CargoPlan\cargoplan.log`.
    validations:
      required: true

  - type: upload
    id: screenshot
    attributes:
      label: Screenshot
      description: The overlay (and the editor or settings window, if involved) when it goes wrong.
    validations:
      required: true
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.webm"

  - type: textarea
    id: contracts
    attributes:
      label: ContractTracker contracts
      description: |
        **Required if missions or ContractTracker are involved.** It shows what the overlay read from ContractTracker.
        1. Close ContractTracker.
        2. Open PowerShell in the SC-CargoPlan folder (the one with `CargoPlan.App.exe`) and copy the database there:
           `Copy-Item "$env:APPDATA\SCContractTracker\contracts.db" .\contracts-copy.db` (or your own path)
        3. Run the command-line tool on the copy: `.\CargoPlan.Cli.exe contracts .\contracts-copy.db --raw`
        4. Read it before you paste it: it holds the contract texts as ContractTracker captured them.
      render: text

  - type: input
    id: game-version
    attributes:
      label: Star Citizen version
      placeholder: 4.10.1-LIVE
    validations:
      required: true

  - type: dropdown
    id: window-mode
    attributes:
      label: Star Citizen window mode
      options:
        - Borderless
        - Windowed
        - Fullscreen
    validations:
      required: true
