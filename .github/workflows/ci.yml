name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Lets the Linux runner compile the WPF projects (net10.0-windows) against
      # reference packs. It can't run WPF, so CargoPlan.App.Tests turns itself
      # off as a test project outside Windows (D12).
      EnableWindowsTargeting: true

    steps:
      - uses: actions/checkout@v7

      # The SDK pinned in global.json (D86), the same one a local build uses.
      # Source: https://github.com/actions/setup-dotnet/blob/v6/action.yml (input global-json-file)
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Core's build fetches the ship data release that build/ship-data.json pins, once and checked (D113): Windows
      # PowerShell on Windows, pwsh on Ubuntu, both on the runners.
      - name: Build
        run: dotnet build -c Release --no-restore

      # The code as .editorconfig describes it (K10, F25); fails on any file format would change. Windows only: the
      # workspace loads the WPF projects, which Ubuntu only compiles against reference packs.
      # Source: https://learn.microsoft.com/dotnet/core/tools/dotnet-format (--verify-no-changes, --no-restore)
      - name: Format
        if: runner.os == 'Windows'
        run: dotnet format SC-CargoPlan.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      # Plans that reach the search limit take about 1.3 s each (D58) and stay out of the default run (default.runsettings).
      - name: Slow tests
        run: dotnet test tests/CargoPlan.Core.Tests -c Release --no-build -p:RunSettingsFilePath= --filter Category=Slow

      # The release's publish and vpk pack with its layout check, without a delta base and without an upload (T11.3, R11):
      # a break in vpk or the SDK shows on the pull request, not on the tag. vpk refuses 0.0.0-dev, so a version of its own.
      - name: Publish and pack
        if: runner.os == 'Windows'
        run: ./build/publish.ps1 -Version 0.0.1-ci

      # The Linux CLI tarball exactly as the release carries it (D115), for the job below to start on Linux. The tarball
      # keeps its modes; the zip the action wraps around it doesn't matter. One day is enough: only this run reads it.
      # Source: https://github.com/actions/upload-artifact/blob/v7/action.yml (name, path, if-no-files-found, retention-days)
      - name: Keep the Linux CLI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: out/release/SC-CargoPlan-Cli-v0.0.1-ci-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The tarball packed on Windows must start on Linux without chmod (K12: a plain tar lost the execute bit). Not scan:
  # its test pictures are CIG material and stay out of the repository; K12 compared 42 captures by hand, byte for byte.
  cli-linux:
    name: Linux CLI from the release tarball
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      # For the mission fixture and the pin of the ship data.
      - uses: actions/checkout@v7

      # Source: https://github.com/actions/download-artifact/blob/v8/action.yml (name, path)
      - uses: actions/download-artifact@v8
        with:
          name: cli-linux-x64
          path: artifact

      # jq is on the runner image. Source: https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
      - name: Unpack and start
        run: |
          set -euo pipefail
          mkdir cli
          tar -xzf artifact/SC-CargoPlan-Cli-v0.0.1-ci-linux-x64.tar.gz -C cli
          cd cli/SC-CargoPlan-Cli
          ls -l CargoPlan.Cli
          version=$(./CargoPlan.Cli --version)
          echo "version: $version"
          [[ "$version" == 0.0.1-ci+* ]] || { echo "::error::CargoPlan.Cli --version says '$version', not 0.0.1-ci"; exit 1; }
          pin=$(jq -r .dataVersion "$GITHUB_WORKSPACE/build/ship-data.json")
          ships=$(./CargoPlan.Cli ships --version)
          echo "ships: $ships"
          [[ "$ships" == "$pin (baseline) "* ]] || { echo "::error::ships --version says '$ships', not $pin (baseline)"; exit 1; }
          ./CargoPlan.Cli plan "$GITHUB_WORKSPACE/tests/CargoPlan.Core.Tests/Fixtures/example_missions.json"
