name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Lets the Linux runner compile the WPF projects (net10.0-windows) against
      # reference packs. It can't run WPF, so CargoPlan.App.Tests turns itself
      # off as a test project outside Windows (D12).
      EnableWindowsTargeting: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      # Plans that reach the search limit take about 1.3 s each (D58) and stay out of the default run (default.runsettings).
      - name: Slow tests
        run: dotnet test tests/CargoPlan.Core.Tests -c Release --no-build -p:RunSettingsFilePath= --filter Category=Slow
