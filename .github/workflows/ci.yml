name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Lets the Linux runner compile the WPF projects (net10.0-windows) against
      # reference packs. It can't run WPF, so CargoPlan.App.Tests turns itself
      # off as a test project outside Windows (D12).
      EnableWindowsTargeting: true

    steps:
      - uses: actions/checkout@v7

      # The SDK pinned in global.json (D86), the same one a local build uses.
      # Source: https://github.com/actions/setup-dotnet/blob/v6/action.yml (input global-json-file)
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # The code as .editorconfig describes it (K10, F25); fails on any file format would change. Windows only: the
      # workspace loads the WPF projects, which Ubuntu only compiles against reference packs.
      # Source: https://learn.microsoft.com/dotnet/core/tools/dotnet-format (--verify-no-changes, --no-restore)
      - name: Format
        if: runner.os == 'Windows'
        run: dotnet format SC-CargoPlan.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      # Plans that reach the search limit take about 1.3 s each (D58) and stay out of the default run (default.runsettings).
      - name: Slow tests
        run: dotnet test tests/CargoPlan.Core.Tests -c Release --no-build -p:RunSettingsFilePath= --filter Category=Slow

      # The release's publish and vpk pack with its layout check, without a delta base and without an upload (T11.3, R11):
      # a break in vpk or the SDK shows on the pull request, not on the tag. vpk refuses 0.0.0-dev, so a version of its own.
      - name: Publish and pack
        if: runner.os == 'Windows'
        run: ./build/publish.ps1 -Version 0.0.1-ci
