name: Release

# A tag v<SemVer> builds, tests and publishes the release (D49). ci.yml only runs for main and PRs, not for tags.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      # First, so a bad tag stops before anything is built. The tag goes in through env, never into the script text.
      - name: Version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          # SemVer 2.0 (https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string)
          # without build metadata: the SDK appends +<commit> itself. [0-9], not \d, which .NET matches for any digit.
          $semVer = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?$'
          if ($version -cnotmatch $semVer) {
              Write-Output "::error::Tag '$env:TAG' is not v<SemVer> (like v0.1.0 or v0.1.0-rc.1, no build metadata)."
              exit 1
          }
          $notes = "docs/release-notes/v$version.md"
          if (-not (Test-Path $notes)) {
              Write-Output "::error::Release notes $notes are missing. Commit them before tagging."
              exit 1
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          # A pre-release flag keeps an rc away from stable installs: GithubSource(prerelease: false) filters by it (D109).
          "PRERELEASE=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      # The SDK pinned in global.json (D86): its runtime is the one the self-contained ZIP ships, as in a local publish.
      # Source: https://github.com/actions/setup-dotnet/blob/v6/action.yml (input global-json-file)
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=$env:VERSION

      - name: Test
        run: dotnet test -c Release --no-build

      # The same script as a local build (R1): publish, delta base from the last release, vpk pack, layout check (D109,
      # T11.3). The token only lifts the API limit of the shared runner IP for vpk download; it reads VPK_TOKEN itself.
      - name: Publish and pack
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/publish.ps1 -Version $env:VERSION -DeltaBase github

      # Pinned to a commit: a third-party action with write access to the repository (D49). Not vpk upload github: it
      # takes Velopack's names from assets.win.json (the ZIP would be CargoPlan-win-Portable.zip, R5), has no .sha256 and
      # makes a draft first. out/release holds the portable ZIP with its hash and the app's feed: releases.win.json and
      # the packages it names (D109 addendum T11.3).
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/release/*
          body_path: docs/release-notes/v${{ env.VERSION }}.md
          prerelease: ${{ env.PRERELEASE }}
          fail_on_unmatched_files: true
